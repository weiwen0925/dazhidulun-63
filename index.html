<!DOCTYPE html>

<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>

<title>大智度論 · 卷六十三 · 全卷彙整</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&amp;family=Noto+Sans+TC:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f7f3ec; --text:#2c2416; --text2:#5a4e3a; --text-muted:#6B5B4B;
  --accent:#8b5e3c; --accentL:#c4956a; --accent-red:#8B2500;
  --gold:#b8860b; --goldL:#d4a84b; --gold-light:#C9A84C;
  --border:#d4c4a8; --border-light:#EDE8E0; --card:#fffdf7;
  --verseBg:#f0e8d8; --verseBd:#c4956a;
  --sbW:76px; --sbBg:#1e1a14; --sbText:#d4c4a8;
  --headGrad:linear-gradient(135deg,#2a2218 0%,#3d3225 50%,#2a2218 100%);
  --r:8px; --primary:#2C1810; --primary-light:#5B3A29;
  --shadow:rgba(91,58,41,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  scrollbar-width:none;-ms-overflow-style:none;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;}
body{
  font-family:"Noto Serif TC","Source Han Serif TC","Songti TC",Georgia,serif;
  background:var(--bg); color:var(--text); line-height:1.8;
  font-size:20px;
}
img{-webkit-user-drag:none;pointer-events:none;}

#top{position:absolute;top:0;left:0;width:1px;height:1px;overflow:hidden;}

#sb{
  position:fixed;left:0;top:0;width:var(--sbW);height:100vh;
  background:var(--sbBg);color:var(--sbText);z-index:100;
  display:flex;flex-direction:column;align-items:center;
  padding:0 0 16px;overflow-y:auto;scrollbar-width:none;
}
#sb::-webkit-scrollbar{display:none;}
.sb-brand{
  position:sticky;top:0;width:100%;
  font-family:"Noto Sans TC",sans-serif;font-size:11px;letter-spacing:2px;
  color:var(--gold);writing-mode:horizontal-tb;text-orientation:mixed;
  text-align:center;line-height:1.5;
  background:linear-gradient(to bottom,var(--sbBg) 78%,rgba(30,26,20,0));
  padding:14px 4px 12px;margin-bottom:6px;z-index:5;
  text-decoration:none;cursor:pointer;
  transition:color .25s,background .25s;display:block;
  border-bottom:1px solid rgba(184,134,11,.25);
}
.sb-brand:hover{color:var(--goldL);}
.sb-brand .sb-brand-line1{display:block;font-size:11px;letter-spacing:1.5px;opacity:.78;}
.sb-brand .sb-brand-line2{display:block;font-size:13.5px;font-weight:700;letter-spacing:2.2px;color:var(--goldL);margin-top:2px;}
.sb-brand .sb-brand-arrow{display:block;font-size:10px;opacity:.55;margin-top:2px;}
.sb-nav{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0 12px;width:100%;}
.sb-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px 4px;text-decoration:none;color:var(--sbText);
  font-family:"Noto Sans TC",sans-serif;width:100%;
  transition:color .25s,background .25s;
}
.sb-circle{
  width:34px;height:34px;border-radius:50%;
  background:rgba(184,134,11,.15);border:1px solid rgba(184,134,11,.4);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:600;color:var(--gold);
  transition:all .25s;
}
.sb-label{font-size:11.5px;letter-spacing:1px;opacity:.85;line-height:1.3;text-align:center;max-width:64px;}
.sb-item:hover .sb-circle{background:rgba(184,134,11,.3);color:var(--goldL);}
.sb-item.active .sb-circle{
  background:linear-gradient(135deg,var(--gold),var(--goldL));
  color:#fff;border-color:var(--goldL);
  box-shadow:0 0 12px rgba(212,168,75,.5);
}
.sb-item.active .sb-label{color:var(--goldL);opacity:1;}

#sbToggle{
  display:none;position:fixed;top:14px;left:14px;z-index:200;
  width:44px;height:44px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:22px;cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.read-progress{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:120;background:rgba(30,26,20,.92);color:var(--gold);
  padding:9px 24px;border-radius:30px;
  border:1px solid rgba(184,134,11,.5);
  box-shadow:0 4px 18px rgba(0,0,0,.25);
  font-family:"Noto Sans TC",sans-serif;
  font-size:14px;letter-spacing:2px;
  display:flex;align-items:center;gap:12px;
  pointer-events:none;user-select:none;
  backdrop-filter:blur(6px);
}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;background:linear-gradient(90deg,var(--gold),var(--goldL));width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px;}
.read-progress .rp-label{font-size:12px;opacity:.75;letter-spacing:3px;}

.main{margin-left:var(--sbW);padding:0;}

/* ============ HERO ============ */
.site-hero{
  position:relative;background:var(--headGrad);
  color:#f0e3c4;padding:80px 30px 70px;text-align:center;
  overflow:hidden;border-bottom:3px solid var(--gold);
}
.site-hero::before{
  content:"般若清淨";position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);font-size:280px;font-weight:900;
  color:rgba(212,168,75,.04);white-space:nowrap;pointer-events:none;
  font-family:"Noto Serif TC",serif;letter-spacing:30px;
}
.hero-content{position:relative;z-index:2;max-width:780px;margin:0 auto;}
.hero-volume{font-size:18px;letter-spacing:6px;color:var(--gold);margin-bottom:16px;font-family:"Noto Sans TC",sans-serif;}
.hero-title{font-size:56px;font-weight:900;color:var(--goldL);letter-spacing:8px;margin-bottom:18px;text-shadow:0 2px 12px rgba(0,0,0,.4);}
.hero-sub{font-size:18px;color:#d4c4a8;letter-spacing:3px;margin-bottom:8px;}
.hero-sub2{font-size:18px;color:#d4c4a8;letter-spacing:2px;margin-bottom:22px;font-family:"Noto Serif TC",serif;}
.hero-range{display:inline-block;font-size:17px;letter-spacing:4px;color:var(--gold);padding:8px 22px;border:1px solid var(--gold);border-radius:30px;font-family:"Noto Sans TC",sans-serif;}

/* ============ PREFACE ============ */
.preface{max-width:920px;margin:50px auto 30px;padding:0 30px;}
.preface-title{text-align:center;font-size:30px;color:var(--accent);font-weight:700;letter-spacing:4px;margin-bottom:24px;position:relative;padding-bottom:16px;}
.preface-title::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.preface p{font-size:19px;line-height:2.1;color:var(--text2);margin:14px 0;text-align:justify;text-indent:2em;}

/* ============ TOC ============ */
.toc-section{max-width:1100px;margin:50px auto 30px;padding:0 30px;}
.toc-title{text-align:center;font-size:34px;color:var(--accent);font-weight:700;letter-spacing:8px;margin-bottom:14px;position:relative;padding-bottom:16px;}
.toc-title::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:80px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.toc-desc{text-align:center;font-size:17px;color:var(--text-muted);letter-spacing:3px;margin-bottom:32px;font-family:"Noto Sans TC",sans-serif;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;}
.toc-card{
  display:flex;align-items:center;gap:16px;
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:16px 22px;
  text-decoration:none;color:var(--text);
  transition:all .25s;cursor:pointer;
  box-shadow:0 1px 3px var(--shadow);
}
.toc-card:hover{transform:translateX(4px);box-shadow:0 4px 12px var(--shadow);border-color:var(--gold);}
.toc-num{
  flex-shrink:0;width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--goldL));
  color:#fff;font-weight:700;font-size:17px;
  display:flex;align-items:center;justify-content:center;
  font-family:"Noto Sans TC",sans-serif;
  box-shadow:0 2px 6px rgba(184,134,11,.3);
}
.toc-name{font-size:19.5px;line-height:1.7;color:var(--text);font-weight:600;}
.toc-name small{display:block;font-size:14px;color:var(--text-muted);font-weight:400;margin-top:4px;letter-spacing:1px;}

/* ============ CHAPTER ============ */
.chapter{margin:36px 0;scroll-margin-top:20px;}
.ch-head{
  background:var(--headGrad);color:#f0e3c4;
  padding:40px 30px 36px;text-align:center;
  border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);
  position:relative;
}
.ch-head::after{
  content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
  width:60px;height:2px;background:var(--goldL);
}
.ch-num{font-size:18px;color:var(--gold);letter-spacing:5px;margin-bottom:14px;font-family:"Noto Sans TC",sans-serif;}
.ch-name{font-size:34px;font-weight:700;color:var(--goldL);letter-spacing:6px;margin-bottom:12px;text-shadow:0 1px 6px rgba(0,0,0,.3);}
.ch-sub{font-size:17px;color:#d4c4a8;letter-spacing:2px;font-family:"Noto Serif TC",serif;}
.ch-body{max-width:1080px;margin:0 auto;padding:24px 20px;}

/* ============ BRIDGE ============ */
.bridge{
  background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border:1px solid var(--border);
  border-left:5px solid var(--gold);
  border-radius:10px;
  padding:18px 24px;margin:0 0 26px;
  box-shadow:0 2px 10px rgba(91,58,41,.06);
}
.bridge-outro{
  border-left-color:var(--accentL);
  background:linear-gradient(135deg,#fdf8e8,#f2e6c8);
  margin-top:30px;margin-bottom:14px;
}
.bridge-label{
  display:inline-block;
  font-family:"Noto Sans TC",sans-serif;font-size:12.5px;
  background:var(--gold);color:#fff;
  padding:4px 14px;border-radius:14px;
  letter-spacing:2.2px;margin-bottom:12px;font-weight:600;
}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0;color:var(--text2);line-height:2.1;font-size:18.5px;text-align:justify;}

/* ============ IFRAME ============ */
.ch-frame{
  display:block;width:100%;border:0;
  background:#fffdf7;
  border:1px solid var(--border);
  border-radius:12px;
  box-shadow:0 4px 20px rgba(91,58,41,.1);
  margin:0 0 8px;
  min-height:180px;
}

.next-link{
  display:inline-block;margin-top:24px;
  padding:11px 28px;border-radius:30px;
  background:linear-gradient(135deg,var(--gold),var(--goldL));
  color:#fff;font-weight:600;text-decoration:none;
  font-size:17px;letter-spacing:2px;font-family:"Noto Sans TC",sans-serif;
  box-shadow:0 4px 12px rgba(184,134,11,.3);transition:all .25s;
}
.next-link:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(184,134,11,.45);}

/* ============ FOOTER ============ */
.site-footer{
  background:linear-gradient(180deg,var(--bg),#ebe2cd);
  text-align:center;padding:40px 24px 80px;
  border-top:1px solid var(--border);margin-top:50px;
}
.site-footer p{font-size:15px;color:var(--text-muted);letter-spacing:2px;margin:6px 0;line-height:1.7;}
.site-footer .ft-line1{font-weight:600;color:var(--accent);font-size:16px;}

#backTop{
  display:none;position:fixed;right:24px;bottom:88px;z-index:130;
  width:44px;height:44px;border-radius:50%;border:1px solid var(--border);
  background:var(--card);color:var(--accent);font-size:22px;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.15);
}

/* ============ 響應式 ============ */
@media(max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .3s;}
  #sb.open{transform:translateX(0);}
  #sbToggle{display:flex;align-items:center;justify-content:center;}
  .main{margin-left:0;}
  .site-hero{padding:60px 20px 50px;}
  .hero-title{font-size:42px;letter-spacing:5px;}
  .ch-head{padding:30px 20px;}
  .ch-name{font-size:26px;letter-spacing:3px;}
  .ch-body{padding:18px 12px;}
  .toc-grid{grid-template-columns:1fr;}
  .preface{padding:0 18px;}
}
@media(max-width:600px){
  body{font-size:17px;}
  .hero-title{font-size:36px;}
  .preface p{font-size:16.5px;}
  .toc-name{font-size:17px;}
}

  font-size:17px;color:var(--text-muted);
  text-align:center;margin-bottom:42px;letter-spacing:3px;
}
.toc-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:18px;
}
.toc-card{
  display:flex;align-items:flex-start;gap:14px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:18px 20px;text-decoration:none;color:var(--text);
  transition:transform .25s,box-shadow .25s,border-color .25s;
  box-shadow:0 1px 3px rgba(91,58,41,.06);
}
.toc-card:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(91,58,41,.12);
  border-color:var(--gold);
}
.toc-num{
  flex-shrink:0;width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--goldL));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-weight:700;font-size:18px;
  box-shadow:0 2px 6px rgba(184,134,11,.3);
}
.toc-name{font-size:19.5px;line-height:1.7;color:var(--text);font-weight:500;letter-spacing:1.5px;}

.chapter{margin:0;padding:0;}
.ch-head{
  background:var(--headGrad);color:#f4ead4;
  padding:54px 32px 50px;text-align:center;position:relative;
}
.ch-head::after{
  content:&quot;&quot;;position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
  width:80px;height:2px;background:linear-gradient(90deg,transparent,var(--goldL),transparent);
}
.ch-num{
  font-family:&quot;Noto Sans TC&quot;,sans-serif;
  font-size:18px;letter-spacing:6px;color:var(--goldL);opacity:.85;
  margin-bottom:16px;
}
.ch-name{
  font-size:34px;font-weight:700;letter-spacing:5px;color:var(--goldL);
  text-shadow:0 2px 10px rgba(0,0,0,.3);margin-bottom:14px;
}
.ch-sub{font-size:17px;letter-spacing:3px;color:#e8ddc0;opacity:.9;}

.ch-body{
  max-width:980px;margin:0 auto;padding:54px 36px 72px;
  background:var(--card);
  border-left:1px solid var(--border);
  border-right:1px solid var(--border);
}

.ch-body h2{
  font-size:30px;color:var(--accent);font-weight:700;
  margin:36px 0 18px;padding:10px 0 10px 22px;
  border-left:4px solid var(--gold);
  background:linear-gradient(90deg,rgba(212,168,75,.12),transparent);
  letter-spacing:2px;
}
.ch-body h2:first-child{margin-top:0;}
.ch-body h3{
  font-size:23.5px;color:var(--text);font-weight:600;
  margin:30px 0 12px;padding-bottom:8px;
  border-bottom:1px solid var(--border);letter-spacing:1.5px;
}
.ch-body h4{
  font-size:20px;color:var(--text2);font-weight:600;
  margin:22px 0 10px;letter-spacing:1px;
}
.ch-body h5{
  font-size:18.5px;color:var(--gold);font-weight:600;
  margin:14px 0 8px;letter-spacing:1px;
}
.ch-body p{
  font-size:20px;line-height:1.95;color:var(--text);
  margin:0 0 14px;text-indent:2em;
}
.ch-body p.no-indent{text-indent:0;}
.ch-body strong,.ch-body b{color:var(--accent-red);font-weight:600;}

.classical-text{
  background:#FFFDF5;border:1px solid #E8E0D0;border-radius:10px;
  padding:20px 26px;margin:18px 0;line-height:1.95;
  position:relative;
}
.classical-text p{font-size:20px;line-height:2;color:var(--text);margin-bottom:12px;}
.classical-text p:last-child{margin-bottom:0;}
.text-label{
  display:inline-block;background:var(--primary);color:#fff;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:13.5px;
  padding:3px 12px;border-radius:14px;
  letter-spacing:3px;margin-bottom:12px;
}

.verse{
  background:var(--verseBg);border-left:4px solid var(--verseBd);
  padding:16px 24px;margin:18px 0;
  line-height:2.1;font-size:21px;
  white-space:normal;text-align:center;
  border-radius:0 8px 8px 0;
}

.card,.insight,.commentary,.note{
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:16px 22px;margin:16px 0;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}
.insight{border-left:4px solid var(--gold);}
.note{border-left:4px solid var(--accentL);background:#fffdf5;}
.commentary{background:#fefaf0;border-left:4px solid var(--accent-red);}

.qa{margin:18px 0;}
.qa .q,.qa .a{
  font-size:20px;line-height:1.95;
  padding:12px 20px;border-radius:8px;margin-bottom:8px;
}
.qa .q{
  background:rgba(73,128,178,.08);
  border-left:4px solid #4980b2;color:#2a4a6a;
}
.qa .a{
  background:rgba(139,94,60,.06);
  border-left:4px solid var(--accent);color:var(--text);
}
.qa .q::before{content:&quot;問　&quot;;font-weight:700;color:#4980b2;}
.qa .a::before{content:&quot;答　&quot;;font-weight:700;color:var(--accent);}

.flow-chart{
  display:flex;flex-direction:column;align-items:center;
  gap:8px;margin:22px 0;padding:18px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
}
.flow-step{
  background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border:1px solid var(--border);border-radius:8px;
  padding:12px 22px;font-size:17.5px;color:var(--text);
  text-align:center;min-width:240px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}
.flow-step strong{color:var(--accent-red);}
.flow-step small{display:block;font-size:14px;color:var(--text-muted);margin-top:4px;}
.flow-arrow{font-size:22px;color:var(--gold);font-weight:700;}

.domino-chain{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:6px;margin:20px 0;padding:18px 16px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
}
.domino{
  background:linear-gradient(135deg,#8b2500,#5b3a29);
  color:#fff;padding:10px 18px;border-radius:6px;
  font-size:16px;letter-spacing:1.5px;font-weight:600;
  box-shadow:0 2px 6px rgba(139,37,0,.25);
}
.chain-arrow{color:var(--accent-red);font-weight:700;font-size:20px;}

.four-grid{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:14px;margin:18px 0;
}
.four-grid .cell{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:18px 20px;
  position:relative;
}
.four-grid .cell-num{
  position:absolute;top:14px;right:18px;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;
  font-size:38px;font-weight:900;color:rgba(184,134,11,.18);
  line-height:1;
}
.four-grid .cell-title{
  font-size:18.5px;color:var(--accent);font-weight:700;
  margin-bottom:8px;letter-spacing:1px;
}
.four-grid .cell-desc{font-size:18px;line-height:1.8;color:var(--text2);}

.three-col{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:14px;margin:18px 0;
}
.three-col .col{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:16px 18px;
}
.three-col .col-title{
  font-size:18.5px;color:var(--accent);font-weight:700;
  margin-bottom:10px;letter-spacing:1px;
  padding-bottom:6px;border-bottom:1px solid var(--border-light);
}
.three-col .col-content{font-size:18px;line-height:1.85;color:var(--text2);}

.two-col{
  display:grid;grid-template-columns:1fr 1fr;
  gap:14px;margin:18px 0;
}
.two-col .col-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:16px 20px;
}

.ch-end{
  display:flex;justify-content:center;align-items:center;
  margin:42px 0 0;padding:18px 0;
}
.ch-end-mark{
  font-family:&quot;Noto Sans TC&quot;,sans-serif;
  font-size:13px;letter-spacing:6px;color:var(--gold);opacity:.6;
  padding:6px 18px;border:1px solid rgba(184,134,11,.3);border-radius:14px;
}

.site-footer{
  background:var(--sbBg);color:var(--sbText);
  padding:36px 32px;text-align:center;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:15px;letter-spacing:3px;line-height:2;
}
.site-footer p{opacity:.75;margin:6px 0;}
.site-footer .footer-line{color:var(--gold);font-weight:600;font-size:16px;}

#backTop{
  position:fixed;right:24px;bottom:24px;
  width:44px;height:44px;border-radius:50%;
  border:none;background:var(--gold);color:#fff;
  font-size:22px;cursor:pointer;display:none;
  box-shadow:0 4px 14px rgba(184,134,11,.4);z-index:110;
  transition:all .25s;
}
#backTop:hover{background:var(--goldL);transform:translateY(-2px);}

@media (max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .3s;}
  #sb.show{transform:translateX(0);}
  #sbToggle{display:flex;align-items:center;justify-content:center;}
  .main{margin-left:0;}
  .hero-title{font-size:42px;letter-spacing:5px;}
  .ch-name{font-size:26px;letter-spacing:3px;}
  .ch-body{padding:36px 22px 52px;}
  .four-grid,.three-col,.two-col{grid-template-columns:1fr;}
  .toc-grid{grid-template-columns:1fr;}
}
@media (max-width:600px){
  body{font-size:17px;}
  .hero-title{font-size:34px;}
  .ch-name{font-size:22px;}
  .ch-body h2{font-size:24px;}
  .ch-body h3{font-size:20px;}
  .ch-body p,.classical-text p{font-size:18px;}
}

.preface-title::after{content:&quot;&quot;;position:absolute;bottom:0;left:50%;
  transform:translateX(-50%);width:80px;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.preface p{margin-bottom:18px;font-size:19px;line-height:2.1;color:var(--text2);}
.preface p strong{color:var(--accent-red);font-weight:600;}

/* TOC */
.toc-section{max-width:1100px;margin:30px auto 60px;padding:0 30px;}
.toc-title{font-size:34px;color:var(--accent);text-align:center;
  letter-spacing:8px;font-weight:700;margin-bottom:14px;}
.toc-desc{text-align:center;color:var(--text-muted);font-size:17px;
  letter-spacing:2px;margin-bottom:36px;font-family:&quot;Noto Sans TC&quot;,sans-serif;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;}
.toc-card{background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:20px 22px;display:flex;align-items:flex-start;gap:16px;
  cursor:pointer;transition:.25s;box-shadow:0 2px 8px var(--shadow);}
.toc-card:hover{transform:translateY(-3px);
  box-shadow:0 8px 24px rgba(91,58,41,.18);border-color:var(--gold);}
.toc-num{flex-shrink:0;width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--goldL));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:17px;font-weight:700;}
.toc-name{flex:1;font-size:19.5px;color:var(--text);line-height:1.7;font-weight:500;}

/* 章節 */
.chapter{margin:0 0 60px;}
.ch-head{background:var(--headGrad);padding:60px 30px 50px;text-align:center;
  color:#fff;position:relative;overflow:hidden;}
.ch-head::after{content:&quot;&quot;;position:absolute;bottom:18px;left:50%;
  transform:translateX(-50%);width:120px;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.ch-num{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:18px;
  letter-spacing:5px;color:var(--goldL);margin-bottom:16px;}
.ch-name{font-size:34px;font-weight:700;color:#fff;letter-spacing:5px;
  line-height:1.4;margin-bottom:12px;}
.ch-sub{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:17px;
  color:rgba(212,168,75,.85);letter-spacing:3px;}
.ch-body{max-width:980px;margin:40px auto 0;padding:0 30px;}

/* 橋接 */
.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border:1px solid var(--border);border-left:5px solid var(--gold);
  border-radius:10px;padding:18px 24px;margin:0 0 26px;
  box-shadow:0 2px 10px rgba(91,58,41,.06);}
.bridge-outro{border-left-color:var(--accentL);
  background:linear-gradient(135deg,#fdf8e8,#f2e6c8);
  margin-top:30px;margin-bottom:14px;}
.bridge-label{display:inline-block;font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:12.5px;
  background:var(--gold);color:#fff;padding:3px 12px;border-radius:12px;
  letter-spacing:2.2px;margin-bottom:10px;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0 0 8px;color:var(--text2);line-height:2.1;font-size:18.5px;}
.bridge p:last-child{margin-bottom:0;}

/* 標題 */
h1,h2,h3,h4,h5{font-family:&quot;Noto Serif TC&quot;,serif;color:var(--text);}
h2{font-size:30px;font-weight:700;color:var(--accent);
  margin:32px 0 14px;padding:10px 0 10px 20px;
  border-left:4px solid var(--gold);letter-spacing:2px;
  background:linear-gradient(90deg,rgba(184,134,11,.08),transparent);}
h3{font-size:23.5px;font-weight:600;color:var(--text);
  margin:24px 0 10px;padding-bottom:6px;
  border-bottom:1px solid var(--border-light);letter-spacing:1.5px;}
h4{font-size:20px;font-weight:600;color:var(--text2);margin:20px 0 8px;letter-spacing:1px;}
h5{font-size:18.5px;font-weight:600;color:var(--gold);margin:14px 0 6px;letter-spacing:1px;}

/* 段落 */
p{margin:0 0 12px;font-size:20px;line-height:1.9;color:var(--text);}
p strong,p b{color:var(--accent-red);font-weight:600;}

/* 經典原文 */
.classical-text{background:#FFFDF5;border:1px solid #E8E0D0;border-radius:10px;
  padding:18px 24px;margin:16px 0;line-height:2;position:relative;font-size:20px;}
.classical-text p{font-size:20px;line-height:2;}
.classical-text p+p{margin-top:14px;}
.text-label{display:inline-block;font-family:&quot;Noto Sans TC&quot;,sans-serif;
  font-size:13.5px;letter-spacing:2.2px;background:var(--accent);color:#fff;
  padding:3px 12px;border-radius:4px;margin-bottom:10px;font-weight:500;}

/* 卡片 */
.card,.insight,.commentary,.note,.metaphor{
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:16px 22px;margin:14px 0;
  box-shadow:0 1px 3px rgba(0,0,0,.08);}
.card-title{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:14px;
  letter-spacing:2px;color:var(--gold);margin-bottom:8px;font-weight:600;
  display:inline-block;border-bottom:2px solid var(--gold);padding-bottom:3px;}
.insight{border-left:5px solid var(--gold);}
.commentary{border-left:5px solid var(--accent);}
.note{border-left:5px solid var(--accentL);background:#fffaf0;}

/* 偈頌 */
.verse,.gatha,blockquote{
  background:var(--verseBg);border-left:4px solid var(--verseBd);
  padding:14px 22px;line-height:2.2;text-align:center;font-size:22px;
  margin:16px 0;color:var(--text);}

/* 問答 */
.qa{margin:16px 0;}
.qa .q,.qa .a{font-size:20px;line-height:1.9;padding:10px 20px;margin:8px 0;border-radius:6px;}
.qa .q{background:#eaf2f8;border-left:4px solid #4a6fa5;color:#2c3e50;}
.qa .a{background:#fdf8ee;border-left:4px solid var(--accent);color:var(--text);}

/* 格線 */
.four-grid,.two-col,.three-col{display:grid;gap:14px;margin:14px 0;}
.four-grid{grid-template-columns:repeat(2,1fr);}
.two-col{grid-template-columns:repeat(2,1fr);}
.three-col{grid-template-columns:repeat(3,1fr);}
.four-grid&gt;div,.two-col&gt;div,.three-col&gt;div{
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:14px 18px;font-size:19px;line-height:1.8;
  box-shadow:0 1px 3px rgba(0,0,0,.06);}
.four-grid&gt;div h5,.two-col&gt;div h5,.three-col&gt;div h5{margin-top:0;margin-bottom:6px;}

/* 流程 */
.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:10px;margin:14px 0;padding:14px 18px;background:var(--card);
  border:1px solid var(--border);border-radius:8px;}
.flow.flow-v{flex-direction:column;}
.flow-box,.flow-step{padding:10px 18px;background:#fffdf7;
  border:1px solid var(--border);border-radius:6px;font-size:17.5px;
  text-align:center;min-width:140px;}
.flow-arrow{font-size:22px;color:var(--gold);font-weight:700;}

/* 列表 */
ol,ul{padding-left:1.6em;margin:0 0 12px;}
ol li,ul li{margin-bottom:6px;font-size:20px;line-height:1.85;}

/* 總結卡 */
.takeaway{background:linear-gradient(135deg,#fffdf5,#f0e8d8);
  border:2px solid var(--gold);border-radius:12px;
  padding:22px 28px;margin:22px 0;
  box-shadow:0 4px 18px rgba(184,134,11,.15);}
.takeaway-title{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:14px;
  letter-spacing:3px;color:#fff;background:var(--gold);
  padding:4px 14px;border-radius:14px;display:inline-block;margin-bottom:12px;}
.takeaway p{font-size:19.5px;line-height:1.95;color:var(--text);}

/* 進度條 */
.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:120;background:rgba(30,26,20,.92);color:var(--gold);
  padding:9px 24px;border-radius:30px;
  border:1px solid rgba(184,134,11,.5);
  box-shadow:0 4px 18px rgba(0,0,0,.25);
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:14px;letter-spacing:2px;
  display:flex;align-items:center;gap:12px;
  pointer-events:none;user-select:none;backdrop-filter:blur(6px);}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);
  border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;
  background:linear-gradient(90deg,var(--gold),var(--goldL));
  width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px;}
.read-progress .rp-label{font-size:12px;opacity:.75;letter-spacing:3px;}

/* 回頂 */
#backTop{position:fixed;right:20px;bottom:60px;z-index:110;width:44px;height:44px;
  border-radius:50%;background:var(--sbBg);color:var(--gold);
  border:1px solid rgba(184,134,11,.4);font-size:20px;cursor:pointer;
  display:none;box-shadow:0 4px 14px rgba(0,0,0,.18);}
#backTop.show{display:block;}

/* 頁尾 */
.site-footer{background:var(--sbBg);color:var(--sbText);text-align:center;
  padding:40px 30px;margin-top:60px;}
.site-footer p{color:rgba(212,196,168,.7);font-size:15px;line-height:1.9;margin:6px 0;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;letter-spacing:1.5px;}
.site-footer .footer-title{color:var(--goldL);font-size:18px;letter-spacing:4px;
  margin-bottom:14px;font-weight:600;}

/* 響應式 */
@media (max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .3s;}
  #sb.open{transform:translateX(0);}
  #sbToggle{display:block;}
  .main{margin-left:0;}
  .site-hero{padding:60px 20px 50px;}
  .hero-title{font-size:36px;letter-spacing:4px;}
  .ch-head{padding:40px 20px;}
  .ch-name{font-size:24px;letter-spacing:3px;}
  .ch-body{padding:0 18px;}
  .four-grid,.two-col,.three-col{grid-template-columns:1fr;}
  .toc-grid{grid-template-columns:1fr;}
}
@media (max-width:600px){
  body{font-size:17px;} .hero-title{font-size:30px;}
  h2{font-size:22px;} h3{font-size:19px;} p{font-size:17px;}
}

    var a=e.target;
    while(a&amp;&amp;a.tagName!=='A') a=a.parentElement;
    if(!a) return;

      var fr=window.frameElement;
      var frRect=fr.getBoundingClientRect();
      var targetY=window.parent.scrollY+frRect.top+rect.top-60;

})();

&lt;html lang=&quot;zh-Hant&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;/&gt;&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&amp;amp;family=Noto+Sans+TC:wght@300;400;500;700&amp;amp;display=swap&quot; rel=&quot;stylesheet&quot;/&gt;&lt;style&gt;
:root{
  --bg:#f7f3ec; --text:#2c2416; --text2:#5a4e3a; --text-muted:#6B5B4B;
  --accent:#8b5e3c; --accentL:#c4956a; --accent-red:#8B2500;
  --gold:#b8860b; --goldL:#d4a84b; --gold-light:#C9A84C;
  --border:#d4c4a8; --border-light:#EDE8E0; --card:#fffdf7;
  --verseBg:#f0e8d8; --verseBd:#c4956a;
  --sbW:76px; --sbBg:#1e1a14; --sbText:#d4c4a8;
  --headGrad:linear-gradient(135deg,#2a2218 0%,#3d3225 50%,#2a2218 100%);
  --r:8px;
  --primary:#2C1810; --primary-light:#5B3A29;
  --shadow:rgba(91,58,41,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  scrollbar-width:none;-ms-overflow-style:none;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;}
img{-webkit-user-drag:none;pointer-events:none;}
body{
  background:var(--bg);color:var(--text);
  font-family:&quot;Noto Serif TC&quot;,&quot;Source Han Serif TC&quot;,&quot;Songti TC&quot;,Georgia,serif;
  font-size:20px;line-height:1.85;
}

/* ============ Sidebar ============ */
#sb{position:fixed;left:0;top:0;width:var(--sbW);height:100vh;
  background:var(--sbBg);color:var(--sbText);z-index:100;
  display:flex;flex-direction:column;align-items:center;
  padding:0 0 16px;overflow-y:auto;scrollbar-width:none;}
#sb::-webkit-scrollbar{display:none;}
.sb-brand{position:sticky;top:0;width:100%;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:11px;letter-spacing:2px;
  color:var(--gold);text-align:center;line-height:1.5;
  background:linear-gradient(to bottom,var(--sbBg) 78%,rgba(30,26,20,0));
  padding:14px 4px 12px;margin-bottom:6px;z-index:5;
  text-decoration:none;cursor:pointer;
  transition:color .25s,background .25s;display:block;
  border-bottom:1px solid rgba(184,134,11,.25);}
.sb-brand:hover{color:var(--goldL);}
.sb-brand .sb-brand-line1{display:block;font-size:11px;letter-spacing:1.5px;opacity:.78;}
.sb-brand .sb-brand-line2{display:block;font-size:13px;font-weight:700;
  letter-spacing:2.2px;color:var(--goldL);margin-top:2px;}
.sb-brand .sb-brand-arrow{display:block;font-size:10px;opacity:.55;margin-top:2px;}
.sb-nav{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;padding:6px 4px;}
.sb-item{display:flex;flex-direction:column;align-items:center;gap:4px;
  text-decoration:none;color:var(--sbText);padding:5px 4px;width:100%;
  border-radius:6px;transition:background .25s,color .25s;cursor:pointer;}
.sb-item:hover{background:rgba(184,134,11,.10);color:var(--goldL);}
.sb-item.active{background:linear-gradient(135deg,rgba(184,134,11,.28),rgba(212,168,75,.16));
  color:var(--goldL);box-shadow:0 0 12px rgba(184,134,11,.25) inset;}
.sb-circle{width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid rgba(184,134,11,.5);font-family:&quot;Noto Sans TC&quot;,sans-serif;
  font-size:15px;font-weight:600;background:rgba(0,0,0,.18);}
.sb-item.active .sb-circle{background:linear-gradient(135deg,var(--gold),var(--goldL));
  color:#1e1a14;border-color:var(--goldL);}
.sb-label{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:11.5px;letter-spacing:1px;
  text-align:center;line-height:1.2;}

/* ============ Main ============ */
.main{margin-left:var(--sbW);min-height:100vh;}

/* ============ Hero ============ */
.site-hero{
  position:relative;overflow:hidden;
  background:radial-gradient(ellipse at top,#2a2218 0%,#1a1410 100%);
  color:#f7f3ec;padding:90px 40px 84px;text-align:center;
}
.site-hero::before{
  content:&quot;畢竟清淨&quot;;position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:&quot;Noto Serif TC&quot;,serif;font-size:22vw;font-weight:900;
  color:rgba(184,134,11,.04);letter-spacing:1.2rem;pointer-events:none;
  white-space:nowrap;
}
.hero-inner{position:relative;z-index:2;max-width:880px;margin:0 auto;}
.hero-overhead{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:14px;letter-spacing:8px;
  color:var(--gold);margin-bottom:14px;opacity:.85;}
.hero-title{font-size:56px;font-weight:900;letter-spacing:.04em;
  background:linear-gradient(135deg,#f0d68b,#d4a84b 50%,#b8860b);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;margin-bottom:14px;line-height:1.25;}
.hero-subtitle{font-size:20px;color:var(--goldL);letter-spacing:6px;margin-bottom:18px;}
.hero-sub{font-size:18px;color:#d4c4a8;line-height:1.9;max-width:680px;margin:0 auto 22px;}
.hero-meta{display:flex;justify-content:center;gap:30px;flex-wrap:wrap;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:14px;color:#a89377;
  border-top:1px solid rgba(184,134,11,.25);
  border-bottom:1px solid rgba(184,134,11,.25);
  padding:14px 0;margin-top:22px;letter-spacing:2px;}
.hero-range{font-size:17px;color:var(--goldL);margin-top:14px;letter-spacing:3px;}
.hero-skt{font-family:Georgia,serif;font-style:italic;color:#a89377;font-size:15px;margin-top:10px;letter-spacing:1px;}

/* ============ Preface ============ */
.preface{max-width:920px;margin:50px auto 30px;padding:0 30px;}
.preface-title{font-size:30px;color:var(--accent);text-align:center;margin-bottom:20px;
  letter-spacing:6px;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;}
.preface p{font-size:19px;line-height:2.1;color:var(--text2);margin-bottom:16px;
  text-align:justify;text-indent:2em;}

/* ============ TOC ============ */
.toc-section{max-width:1100px;margin:30px auto 50px;padding:30px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  box-shadow:0 4px 18px var(--shadow);}
.toc-title{font-size:34px;text-align:center;color:var(--accent);
  letter-spacing:10px;font-weight:700;margin-bottom:8px;}
.toc-desc{font-size:17px;text-align:center;color:var(--text-muted);
  letter-spacing:3px;margin-bottom:30px;font-family:&quot;Noto Sans TC&quot;,sans-serif;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;}
.toc-card{background:linear-gradient(135deg,#fffdf7,#f5ecd8);
  border:1px solid var(--border);border-left:4px solid var(--gold);
  border-radius:8px;padding:16px 20px;text-decoration:none;color:var(--text);
  display:flex;align-items:flex-start;gap:14px;
  transition:transform .2s,box-shadow .2s;cursor:pointer;}
.toc-card:hover{transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(91,58,41,.12);border-left-color:var(--accent);}
.toc-num{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:17px;font-weight:700;
  color:var(--gold);min-width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--gold);border-radius:50%;background:rgba(184,134,11,.08);
  flex-shrink:0;}
.toc-card:hover .toc-num{background:var(--gold);color:#fff;}
.toc-name{font-size:19.5px;line-height:1.7;color:var(--text);font-weight:600;}

/* ============ Chapter ============ */
.chapter{margin:50px 0;}
.ch-head{
  background:var(--headGrad);color:#f7f3ec;text-align:center;
  padding:50px 30px 44px;position:relative;
}
.ch-head::after{content:&quot;&quot;;position:absolute;bottom:14px;left:50%;
  transform:translateX(-50%);width:90px;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.ch-num{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:18px;
  letter-spacing:5px;color:var(--gold);margin-bottom:14px;opacity:.95;}
.ch-name{font-size:34px;font-weight:700;color:#f0d68b;letter-spacing:.06em;
  margin-bottom:10px;line-height:1.35;}
.ch-sub{font-size:17px;color:#d4c4a8;letter-spacing:3px;margin-top:8px;font-family:&quot;Noto Sans TC&quot;,sans-serif;}

.ch-body{max-width:980px;margin:0 auto;padding:36px 30px 30px;}
.ch-body p{font-size:20px;line-height:1.95;color:var(--text);
  margin-bottom:14px;text-align:justify;text-indent:2em;}
.ch-body p.no-indent{text-indent:0;}

/* ============ Headings ============ */
h2{font-size:30px;font-weight:700;color:var(--accent);
  margin:32px 0 14px;padding:10px 0 10px 20px;
  border-left:4px solid var(--gold);
  background:linear-gradient(90deg,rgba(184,134,11,.08),transparent 60%);
  letter-spacing:2px;}
h3{font-size:23.5px;font-weight:600;color:var(--accent);
  margin:24px 0 10px;padding-bottom:6px;
  border-bottom:1px solid var(--border-light);letter-spacing:1px;}
h4{font-size:20px;font-weight:600;color:var(--text2);margin:18px 0 8px;}
h5{font-size:18.5px;font-weight:600;color:var(--gold);margin:14px 0 6px;letter-spacing:1px;}

strong,b{color:var(--accent-red);font-weight:700;}

/* ============ Cards / Bridges ============ */
.bridge{
  background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border:1px solid var(--border);border-left:5px solid var(--gold);
  border-radius:10px;padding:20px 26px;margin:0 0 24px;
  box-shadow:0 2px 10px rgba(91,58,41,.06);}
.bridge-outro{border-left-color:var(--accentL);
  background:linear-gradient(135deg,#fdf8e8,#f2e6c8);margin-top:30px;margin-bottom:20px;}
.bridge-label{display:inline-block;font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:12.5px;
  background:var(--gold);color:#fff;padding:3px 12px;border-radius:12px;
  letter-spacing:2.2px;margin-bottom:10px;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0 0 8px;color:var(--text2);line-height:2.05;font-size:18.5px;text-indent:0;}
.bridge p:last-child{margin-bottom:0;}

.card{background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:18px 24px;margin:16px 0;
  box-shadow:0 1px 3px rgba(0,0,0,.08);}
.card-title{font-size:21.5px;color:var(--accent);font-weight:700;margin-bottom:10px;
  display:flex;align-items:center;gap:10px;}
.card-title::before{content:&quot;&quot;;display:inline-block;width:6px;height:22px;
  background:var(--gold);border-radius:3px;}
.card p,.card div{font-size:20px;line-height:1.9;color:var(--text);}
.card p{margin-bottom:8px;text-indent:0;}

.insight{background:linear-gradient(135deg,#fffdf5,#fdf6e3);
  border:1px solid var(--gold);border-left:5px solid var(--gold);
  border-radius:10px;padding:18px 24px;margin:18px 0;
  box-shadow:0 2px 12px rgba(184,134,11,.10);}
.insight-title{font-size:21.5px;color:var(--accent);font-weight:700;margin-bottom:10px;
  display:flex;align-items:center;gap:8px;}
.insight-title::before{content:&quot;◆&quot;;color:var(--gold);}
.insight p{font-size:20px;line-height:1.9;color:var(--text);margin:0;text-indent:0;}

.note{background:#fdf8eb;border:1px dashed var(--accentL);border-radius:8px;
  padding:14px 20px;margin:14px 0;}
.note p{font-size:18px;color:var(--text2);text-indent:0;line-height:1.85;margin:0;}

/* ============ Verse / Classical text ============ */
.verse,.gatha,blockquote{
  background:var(--verseBg);border-left:4px solid var(--verseBd);
  padding:16px 24px;line-height:2.1;text-align:center;
  margin:18px 0;border-radius:0 8px 8px 0;
  white-space:normal;font-size:22px;font-weight:500;color:var(--text);}

.classical-text{
  background:#FFFDF5;border:1px solid #E8E0D0;border-radius:10px;
  padding:22px 28px;line-height:2.0;margin:18px 0;
  position:relative;}
.classical-text p{font-size:20px;color:var(--text);margin-bottom:10px;text-indent:2em;}
.classical-text p:last-child{margin-bottom:0;}
.text-label{display:inline-block;background:var(--accent);color:#fff;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:13.5px;
  padding:3px 12px;border-radius:12px;letter-spacing:3px;
  margin-bottom:10px;}

/* ============ Q&amp;A ============ */
.qa{margin:18px 0;}
.qa .q{padding:14px 22px;background:linear-gradient(90deg,rgba(70,110,160,.08),transparent);
  border-left:4px solid #4a7bb0;color:#1e3a5c;font-weight:600;
  margin-bottom:8px;border-radius:0 6px 6px 0;font-size:20px;line-height:1.9;}
.qa .a{padding:14px 22px;background:linear-gradient(90deg,rgba(139,37,0,.06),transparent);
  border-left:4px solid var(--accent-red);color:var(--text);
  border-radius:0 6px 6px 0;font-size:20px;line-height:1.9;}
.qa .q::before{content:&quot;問　&quot;;font-family:&quot;Noto Sans TC&quot;,sans-serif;
  font-weight:700;color:#4a7bb0;}
.qa .a::before{content:&quot;答　&quot;;font-family:&quot;Noto Sans TC&quot;,sans-serif;
  font-weight:700;color:var(--accent-red);}

/* ============ Grids ============ */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0;}
.col-card{background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:16px 20px;}
.col-title{font-size:21.5px;color:var(--accent);font-weight:700;margin-bottom:8px;
  padding-bottom:6px;border-bottom:1px solid var(--border-light);}
.col-content{font-size:20px;line-height:1.9;color:var(--text);}

.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 0;}

.four-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0;}
.four-grid .cell{background:var(--card);border:1px solid var(--border);
  border-left:4px solid var(--accentL);border-radius:8px;padding:16px 22px;}
.four-grid .cell .num{font-family:&quot;Noto Sans TC&quot;,sans-serif;
  color:var(--gold);font-weight:700;letter-spacing:2px;font-size:14px;margin-bottom:6px;}
.four-grid .cell .term{font-size:21px;color:var(--accent);font-weight:700;margin-bottom:8px;}
.four-grid .cell .desc{font-size:19px;color:var(--text2);line-height:1.85;}

/* ============ Flow ============ */
.flow{display:flex;flex-direction:column;align-items:center;gap:8px;margin:24px 0;}
.flow-box{background:var(--card);border:1.5px solid var(--gold);
  border-radius:10px;padding:14px 26px;font-size:17.5px;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;color:var(--text);
  text-align:center;min-width:240px;
  box-shadow:0 2px 8px rgba(184,134,11,.12);}
.flow-box small{display:block;color:var(--text-muted);
  font-size:14px;margin-top:4px;font-family:&quot;Noto Sans TC&quot;,sans-serif;}
.flow-arrow{color:var(--gold);font-size:20px;font-weight:700;}

/* ============ Spectrum ============ */
.spectrum{display:flex;align-items:center;gap:8px;margin:22px 0;
  padding:18px 22px;background:linear-gradient(90deg,rgba(184,134,11,.06),rgba(184,134,11,.16),rgba(184,134,11,.06));
  border:1px solid var(--border);border-radius:12px;}
.sp-node{flex:1;text-align:center;padding:10px;font-family:&quot;Noto Sans TC&quot;,sans-serif;
  font-size:15.5px;color:var(--text);}
.sp-node.sp-mid{background:linear-gradient(135deg,var(--gold),var(--goldL));
  color:#fff;border-radius:8px;font-weight:700;}
.sp-node.sp-mid h5{color:#fff;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.35);margin:0;}
.sp-arrow{color:var(--gold);font-weight:700;font-size:18px;}

/* ============ Read progress (bottom) ============ */
.read-progress{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:120;background:rgba(30,26,20,.92);color:var(--gold);
  padding:9px 24px;border-radius:30px;
  border:1px solid rgba(184,134,11,.5);
  box-shadow:0 4px 18px rgba(0,0,0,.25);
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:14px;letter-spacing:2px;
  display:flex;align-items:center;gap:12px;
  pointer-events:none;user-select:none;backdrop-filter:blur(6px);}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);
  border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;
  background:linear-gradient(90deg,var(--gold),var(--goldL));
  width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:42px;text-align:right;font-size:13px;}
.read-progress .rp-label{font-size:12px;opacity:.75;letter-spacing:3px;}

/* ============ Back to top ============ */
#backTop{position:fixed;right:24px;bottom:74px;width:44px;height:44px;
  border-radius:50%;background:var(--accent);color:#fff;border:0;
  font-size:20px;cursor:pointer;display:none;z-index:110;
  box-shadow:0 4px 14px rgba(0,0,0,.2);transition:transform .2s;}
#backTop:hover{transform:translateY(-2px);background:var(--gold);}
#backTop.show{display:block;}

/* ============ Hamburger (mobile) ============ */
#sbToggle{display:none;position:fixed;top:14px;left:14px;
  width:42px;height:42px;border-radius:8px;background:var(--sbBg);
  color:var(--gold);border:0;font-size:22px;cursor:pointer;z-index:101;}

/* ============ Site footer ============ */
.site-footer{background:#1e1a14;color:#a89377;
  text-align:center;padding:30px 20px;margin-top:60px;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:15px;letter-spacing:2px;}
.site-footer .ft-line{margin:6px 0;line-height:1.8;}
.site-footer .ft-tag{color:var(--goldL);font-weight:600;}

hr{border:0;border-top:1px solid var(--border);margin:24px 0;}

/* ============ Responsive ============ */
@media (max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .3s;}
  #sb.open{transform:translateX(0);}
  .main{margin-left:0;}
  #sbToggle{display:block;}
  .ch-body{padding:24px 18px;}
  .hero-title{font-size:38px;}
  .ch-name{font-size:26px;}
  .two-col,.three-col,.four-grid{grid-template-columns:1fr;}
}
@media (max-width:600px){
  body{font-size:17px;}
  .ch-body p{font-size:17.5px;}

(function(){
  var blk=function(e){e.preventDefault();return false;};
  ['contextmenu','copy','cut','selectstart','dragstart','mousedown'].forEach(function(ev){
    document.addEventListener(ev,function(e){
      if(ev==='mousedown' &amp;&amp; e.button!==2) return;
      blk(e);

  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(e.ctrlKey&amp;&amp;(k==='c'||k==='C'||k==='a'||k==='A'||k==='s'||k==='S'||k==='p'||k==='P'||k==='u'||k==='U'||k==='x'||k==='X')){blk(e);}
    if(k==='F12')blk(e);
    if(e.ctrlKey&amp;&amp;e.shiftKey&amp;&amp;(k==='I'||k==='J'||k==='C'||k==='K')){blk(e);}

})();

(function(){
  if(!window.frameElement) return;
  document.addEventListener('click',function(e){
    var a=e.target;
    while(a&amp;&amp;a.tagName!=='A') a=a.parentElement;
    if(!a) return;
    var h=a.getAttribute('href');
    if(!h||h.charAt(0)!=='#') return;
    e.preventDefault();
    e.stopPropagation();
    var id=h.substring(1);
    var el=document.getElementById(id);
    if(!el) return;
    try{
      var rect=el.getBoundingClientRect();
      var fr=window.frameElement;
      var frRect=fr.getBoundingClientRect();
      var targetY=window.parent.scrollY+frRect.top+rect.top-60;
      window.parent.scrollTo({top:targetY,behavior:'smooth'});
    }catch(ex){}
  },true);
})();

<button aria-label="回到頂部" id="backTop">↑</button>
<script>
// ===== 防複製 =====
(function(){
  var blk=function(e){e.preventDefault();return false;};
  ['contextmenu','copy','cut','selectstart','dragstart'].forEach(function(ev){
    document.addEventListener(ev,blk,true);
  });
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(e.ctrlKey&&(k==='c'||k==='C'||k==='a'||k==='A'||k==='s'||k==='S'||k==='p'||k==='P'||k==='u'||k==='U'||k==='x'||k==='X')){blk(e);}
    if(k==='F12')blk(e);
    if(e.ctrlKey&&e.shiftKey&&(k==='I'||k==='J'||k==='C'||k==='K')){blk(e);}
  },true);
  setInterval(function(){
    if(window.getSelection) try{window.getSelection().removeAllRanges();}catch(e){}
  },300);
})();

// ===== Sidebar Brand 回頂 =====
var sbBrand = document.getElementById('sbBrand');
if(sbBrand){
  sbBrand.addEventListener('click', function(e){
    e.preventDefault();
    window.scrollTo({top:0, behavior:'smooth'});
  });
}

// ===== 漢堡選單 =====
var sb = document.getElementById('sb');
var sbToggle = document.getElementById('sbToggle');
if(sbToggle){
  sbToggle.addEventListener('click', function(){
    sb.classList.toggle('open');
  });
}

// ===== 進度條 =====
var rpFill = document.getElementById('rpFill');
var rpPct  = document.getElementById('rpPct');
function updateProgress(){
  var sh = document.documentElement.scrollHeight - window.innerHeight;
  var pct = sh > 0 ? Math.min(100, Math.max(0, window.scrollY / sh * 100)) : 0;
  if(rpFill) rpFill.style.width = pct + '%';
  if(rpPct)  rpPct.textContent  = Math.round(pct) + '%';
}
window.addEventListener('scroll', updateProgress, {passive:true});
updateProgress();

// ===== Back to top =====
var backTop = document.getElementById('backTop');
window.addEventListener('scroll', function(){
  if(window.scrollY > 600){ backTop.style.display='flex'; backTop.style.alignItems='center'; backTop.style.justifyContent='center'; }
  else { backTop.style.display='none'; }
}, {passive:true});
if(backTop){
  backTop.addEventListener('click', function(){
    window.scrollTo({top:0, behavior:'smooth'});
  });
}

// ===== iframe 自動高度 =====
function resizeFrame(f){
  try{
    var d = f.contentDocument || f.contentWindow.document;
    if(!d || !d.body) return;
    d.body.style.minHeight = '0';
    d.body.style.height    = 'auto';
    if(d.documentElement){
      d.documentElement.style.minHeight = '0';
      d.documentElement.style.height    = 'auto';
    }
    var h = d.body.scrollHeight;
    if(h > 100){
      f.style.height    = h + 'px';
      f.style.minHeight = '0';
    }
  }catch(e){}
}
function resizeAllFrames(){
  document.querySelectorAll('iframe.ch-frame').forEach(resizeFrame);
  if(typeof updateProgress==='function') updateProgress();
}
function setupFrame(f){
  var tries = 0;
  function tick(){
    tries++;
    resizeFrame(f);
    if(tries < 30) setTimeout(tick, 200);
  }
  if(f.contentDocument && f.contentDocument.readyState === 'complete'){
    tick();
  } else {
    f.addEventListener('load', tick);
  }
}
document.querySelectorAll('iframe.ch-frame').forEach(setupFrame);
var rzT;
window.addEventListener('resize', function(){
  clearTimeout(rzT);
  rzT = setTimeout(resizeAllFrames, 200);
});

// ===== 錨點點擊修正 =====
document.addEventListener('click', function(e){
  var a = e.target;
  while(a && a.tagName !== 'A') a = a.parentElement;
  if(!a) return;
  var h = a.getAttribute('href');
  if(!h || h.charAt(0) !== '#' || h.length < 2) return;
  var id = h.substring(1);
  var el = document.getElementById(id);
  if(!el) return;
  e.preventDefault();
  resizeAllFrames();
  setTimeout(function(){
    resizeAllFrames();
    var rect = el.getBoundingClientRect();
    var y = window.scrollY + rect.top - 20;
    window.scrollTo({top:y, behavior:'smooth'});
  }, 60);
}, true);

// ===== 持續輪詢 =====
var _rt=0, _riv=setInterval(function(){
  _rt++; resizeAllFrames();
  if(_rt > 50) clearInterval(_riv);
}, 300);

// ===== Sidebar active 高亮 =====
var sbItems = document.querySelectorAll('.sb-item');
function updateActive(){
  var chs = document.querySelectorAll('.chapter');
  var winH = window.innerHeight;
  var activeIdx = -1;
  for(var i=0;i<chs.length;i++){
    var r = chs[i].getBoundingClientRect();
    if(r.top < winH * 0.35) activeIdx = i;
  }
  sbItems.forEach(function(it, i){
    if(i === activeIdx) it.classList.add('active');
    else it.classList.remove('active');
  });
}
window.addEventListener('scroll', updateActive, {passive:true});
updateActive();
</script>
