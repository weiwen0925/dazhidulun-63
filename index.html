*{margin:0;padding:0;box-sizing:border-box;}
html,body{scrollbar-width:none;-ms-overflow-style:none;}

body{background:var(--bg);color:var(--text);font-family:"Noto Serif TC","Songti TC",Georgia,serif;

a{color:inherit;text-decoration:none;}

#sb::-webkit-scrollbar{display:none;}
.sb-brand{position:sticky;top:0;width:100%;font-family:"Noto Sans TC",sans-serif;text-align:center;line-height:1.5;
background:linear-gradient(to bottom,var(--sbBg) 78%,rgba(30,26,20,0));padding:14px 4px 12px;margin-bottom:6px;z-index:5;
text-decoration:none;cursor:pointer;transition:color .25s;display:block;border-bottom:1px solid rgba(184,134,11,.25);}
.sb-brand:hover{color:var(--goldL);}
.sb-brand .l1{display:block;font-size:11px;letter-spacing:1.5px;opacity:.78;color:var(--gold);}
.sb-brand .l2{display:block;font-size:13px;font-weight:700;letter-spacing:2.2px;color:var(--goldL);margin-top:2px;}
.sb-brand .l3{display:block;font-size:10px;opacity:.55;margin-top:2px;color:var(--gold);}
.sb-nav{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center;margin-top:6px;}
.sb-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 4px;width:100%;cursor:pointer;transition:.2s;border-radius:8px;}
.sb-item:hover{background:rgba(184,134,11,.14);}
.sb-circle{width:34px;height:34px;border-radius:50%;border:1px solid rgba(184,134,11,.5);display:flex;

.sb-label{font-size:11.5px;font-family:"Noto Sans TC",sans-serif;color:var(--sbText);letter-spacing:.3px;opacity:.86;}
.sb-item.active .sb-circle{background:var(--gold);color:#fff;box-shadow:0 0 12px rgba(184,134,11,.7);border-color:var(--goldL);}
.sb-item.active .sb-label{color:var(--goldL);font-weight:700;}

.main{margin-left:var(--sbW);}
.site-hero{position:relative;background:var(--headGrad);color:#f3e9d2;padding:84px 30px 66px;text-align:center;overflow:hidden;}
.site-hero::before{content:"清淨";position:absolute;font-size:360px;font-weight:900;color:rgba(212,168,75,.04);
top:50%;left:50%;transform:translate(-50%,-50%);font-family:"Noto Serif TC",serif;pointer-events:none;white-space:nowrap;}
.hero-title{font-size:56px;font-weight:900;letter-spacing:6px;color:var(--goldL);position:relative;}
.hero-subtitle{font-size:20px;color:#e8dcc0;letter-spacing:2px;position:relative;margin-top:14px;}
.hero-meta{font-size:18px;color:#c9b88f;margin-top:18px;position:relative;line-height:2;}
.hero-range{display:inline-block;margin-top:18px;padding:6px 24px;border:1px solid rgba(184,134,11,.5);border-radius:30px;

.preface-title{text-align:center;font-size:30px;color:var(--accent);font-weight:700;margin-bottom:18px;letter-spacing:2px;}
.preface p{font-size:19px;line-height:2.1;color:var(--text2);margin-bottom:14px;text-align:justify;}

.toc-title{text-align:center;font-size:34px;color:var(--accent);font-weight:700;letter-spacing:6px;}
.toc-desc{text-align:center;font-size:17px;color:var(--text-muted);margin:10px 0 26px;font-family:"Noto Sans TC",sans-serif;letter-spacing:2px;}

.chapter{margin:30px 0;}
.ch-head{background:var(--headGrad);color:#f3e9d2;padding:42px 30px;text-align:center;position:relative;}
.ch-head::after{content:"";display:block;width:80px;height:2px;background:var(--gold);margin:18px auto 0;}

.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);border:1px solid var(--border);border-left:5px solid var(--gold);

.next-link:hover{background:var(--accent);color:#fff;}

.ch-frame{display:block;width:100%;border:0;background:#fffdf7;border:1px solid var(--border);border-radius:12px;

/* read progress */
.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:120;background:rgba(30,26,20,.92);

.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;background:linear-gradient(90deg,var(--gold),var(--goldL));width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px;}
.read-progress .rp-label{font-size:12px;opacity:.85;letter-spacing:4px;color:var(--goldL);}

#backTop{position:fixed;right:22px;bottom:22px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;

#sbToggle{display:none;}

.toc-grid{grid-template-columns:1fr;}}

<script>
/* anti-copy outer */
(function(){var blk=function(e){e.preventDefault();return false;};
['contextmenu','copy','cut','selectstart','dragstart'].forEach(function(ev){document.addEventListener(ev,blk,true);});
document.addEventListener('keydown',function(e){var k=e.key;
if(e.ctrlKey&&(k==='c'||k==='C'||k==='a'||k==='A'||k==='s'||k==='S'||k==='p'||k==='P'||k==='u'||k==='U'||k==='x'||k==='X')){blk(e);}
if(k==='F12')blk(e);if(e.ctrlKey&&e.shiftKey&&(k==='I'||k==='J'||k==='C'||k==='K')){blk(e);}},true);})();
/* iframe auto-height */
function resizeFrame(f){try{var d=f.contentDocument||f.contentWindow.document;if(!d||!d.body)return;
d.body.style.minHeight='0';d.body.style.height='auto';
if(d.documentElement){d.documentElement.style.minHeight='0';d.documentElement.style.height='auto';}
var h=d.body.scrollHeight;if(h>100){f.style.height=h+'px';f.style.minHeight='0';}}catch(e){}}
function resizeAllFrames(){document.querySelectorAll('iframe.ch-frame').forEach(resizeFrame);
if(typeof updateProgress==='function')updateProgress();}
function setupFrame(f){var tries=0;function tick(){tries++;resizeFrame(f);if(tries<30)setTimeout(tick,200);}
if(f.contentDocument&&f.contentDocument.readyState==='complete'){tick();}else{f.addEventListener('load',tick);}}
document.querySelectorAll('iframe.ch-frame').forEach(setupFrame);
var rzT;window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(resizeAllFrames,200);});
document.addEventListener('click',function(e){var a=e.target;while(a&&a.tagName!=='A')a=a.parentElement;if(!a)return;
var h=a.getAttribute('href');if(!h||h.charAt(0)!=='#'||h.length<2)return;var id=h.substring(1);var el=document.getElementById(id);if(!el)return;
e.preventDefault();resizeAllFrames();setTimeout(function(){resizeAllFrames();var rect=el.getBoundingClientRect();
var y=window.scrollY+rect.top-20;window.scrollTo({top:y,behavior:'smooth'});},60);},true);
var _rt=0,_riv=setInterval(function(){_rt++;resizeAllFrames();if(_rt>50)clearInterval(_riv);},300);
/* progress */
var rpFill=document.getElementById('rpFill'),rpPct=document.getElementById('rpPct');
function updateProgress(){var sh=document.documentElement.scrollHeight-window.innerHeight;
var pct=sh>0?Math.min(100,Math.max(0,window.scrollY/sh*100)):0;
if(rpFill)rpFill.style.width=pct+'%';if(rpPct)rpPct.textContent=Math.round(pct)+'%';}
window.addEventListener('scroll',updateProgress,{passive:true});updateProgress();
(function(){var cap=document.getElementById('readProgress');if(!cap)return;
function setHide(on){cap.classList.toggle('hide-near-end',!!on);}
var ts=[].slice.call(document.querySelectorAll('.site-footer,[data-wy-notice="v2"]'));if(!ts.length)return;
if('IntersectionObserver'in window){var io=new IntersectionObserver(function(es){setHide(es.some(function(e){return e.isIntersecting;}));},
{root:null,rootMargin:'0px 0px -20px 0px',threshold:0.01});ts.forEach(function(t){io.observe(t);});}})();
/* sidebar highlight */
var items=[].slice.call(document.querySelectorAll('.sb-item'));
var chapters=[].slice.call(document.querySelectorAll('.chapter'));
function highlight(){var idx=-1;chapters.forEach(function(c,i){if(c.getBoundingClientRect().top<window.innerHeight*0.35)idx=i;});
items.forEach(function(it,i){it.classList.toggle('active',i===idx);});}
window.addEventListener('scroll',highlight,{passive:true});highlight();
/* back to top + brand + hamburger */
var bt=document.getElementById('backTop');
window.addEventListener('scroll',function(){if(window.scrollY>600)bt.classList.add('show');else bt.classList.remove('show');},{passive:true});
bt.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});
var sbBrand=document.getElementById('sbBrand');if(sbBrand)sbBrand.addEventListener('click',function(e){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});});
var sbT=document.getElementById('sbToggle'),sb=document.getElementById('sb');
if(sbT)sbT.addEventListener('click',function(){sb.classList.toggle('open');});

<script id="wy-print-intercept">

      e.preventDefault(); e.stopPropagation();
      return false;
    }
  }, true);
})();
</script>
<script id="wy-decoder">
(function(){
  if(!window.__wyReady) return;
  var KEY = "wy-dazhidulun-63-v1";
  function _dec(b64){
    try{
      var raw = atob(b64);
      var bytes = new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++){
        bytes[i] = (raw.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)) & 0xff;
      }
      if(typeof TextDecoder !== "undefined"){
        return new TextDecoder("utf-8").decode(bytes);
      }
      var s = "";
      for(var j=0;j<bytes.length;j++) s += String.fromCharCode(bytes[j]);
      return decodeURIComponent(escape(s));
    }catch(e){ return null; }
  }
  window.__wyReady.then(function(ok){
    if(!ok) return;
    document.querySelectorAll("iframe.ch-frame[data-c]").forEach(function(oldF){
      var decoded = _dec(oldF.getAttribute("data-c"));
      if(!decoded) return;
      var newF = document.createElement("iframe");
      for(var i=0;i<oldF.attributes.length;i++){
        var a = oldF.attributes[i];
        if(a.name === "data-c" || a.name === "srcdoc") continue;
        try{ newF.setAttribute(a.name, a.value); }catch(e){}
      }
      newF.setAttribute("srcdoc", decoded);
      try{ oldF.parentNode.replaceChild(newF, oldF); }catch(e){ return; }
      if(typeof window.setupFrame === "function"){
        try{ window.setupFrame(newF); }catch(e){}
      }
    });
    document.querySelectorAll("[data-wytext]").forEach(function(el){
      var t = _dec(el.getAttribute("data-wytext"));
      if(t === null) return;
      el.innerHTML = t;
      el.removeAttribute("data-wytext");
    });
    if(typeof window.resizeAllFrames === "function"){
      [150, 800, 2000].forEach(function(ms){
        setTimeout(function(){ try{ window.resizeAllFrames(); }catch(e){} }, ms);
      });
    }
  });
})();
</script>
