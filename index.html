<style>
:root{
  --bg:#f7f3ec; --text:#2c2416; --text2:#5a4e3a; --text-muted:#6B5B4B;
  --accent:#8b5e3c; --accentL:#c4956a; --accent-red:#8B2500;
  --gold:#b8860b; --goldL:#d4a84b; --gold-light:#C9A84C;
  --border:#d4c4a8; --border-light:#EDE8E0; --card:#fffdf7;
  --verseBg:#f0e8d8; --verseBd:#c4956a;
  --sbW:76px; --sbBg:#1e1a14; --sbText:#d4c4a8;
  --headGrad:linear-gradient(135deg,#2a2218 0%,#3d3225 50%,#2a2218 100%);
  --r:8px; --primary:#2C1810; --primary-light:#5B3A29;
  --shadow:rgba(91,58,41,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
*{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-user-drag:none;-webkit-touch-callout:none;}
html,body{scrollbar-width:none;-ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;}
body{
  font-family:"Noto Serif TC","Source Han Serif TC","Songti TC",Georgia,serif;
  font-size:20px; line-height:1.9; color:var(--text); background:var(--bg);
  text-align:justify; -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
img{max-width:100%;-webkit-user-drag:none;pointer-events:none;}

/* sidebar */
#sb{position:fixed;left:0;top:0;width:var(--sbW);height:100vh;
  background:var(--sbBg);color:var(--sbText);z-index:100;
  display:flex;flex-direction:column;align-items:center;
  padding:0 0 16px;overflow-y:auto;scrollbar-width:none;}
#sb::-webkit-scrollbar{display:none;width:0;}
.sb-brand{position:sticky;top:0;width:100%;
  font-family:"Noto Sans TC",sans-serif;font-size:11px;letter-spacing:2px;
  color:var(--gold);text-align:center;line-height:1.5;
  background:linear-gradient(to bottom,var(--sbBg) 78%,rgba(30,26,20,0));
  padding:14px 4px 12px;margin-bottom:6px;z-index:5;
  text-decoration:none;cursor:pointer;
  transition:color .25s,background .25s;display:block;
  border-bottom:1px solid rgba(184,134,11,.25);}
.sb-brand:hover{color:var(--goldL);}
.sb-brand .sb-brand-line1{display:block;font-size:11px;letter-spacing:1.5px;opacity:.78;}
.sb-brand .sb-brand-line2{display:block;font-size:13px;font-weight:700;
  letter-spacing:2.2px;color:var(--goldL);margin-top:2px;}
.sb-brand .sb-brand-arrow{display:block;font-size:10px;opacity:.55;margin-top:2px;}
.sb-nav{display:flex;flex-direction:column;gap:14px;align-items:center;
  width:100%;padding:8px 0 16px;}
.sb-item{display:flex;flex-direction:column;align-items:center;
  cursor:pointer;text-decoration:none;color:inherit;
  padding:6px 4px;border-radius:6px;width:62px;
  transition:background .25s;}
.sb-item:hover{background:rgba(184,134,11,.08);}
.sb-item.active .sb-circle{
  background:radial-gradient(circle,var(--gold) 0%,#946c08 100%);
  color:#fff;box-shadow:0 0 12px rgba(184,134,11,.65);}
.sb-item.active .sb-label{color:var(--goldL);font-weight:700;}
.sb-circle{display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;
  background:#2d2820;color:var(--gold-light);
  font-family:"Noto Sans TC",sans-serif;font-size:15px;font-weight:700;
  border:1px solid rgba(184,134,11,.4);transition:all .25s;}
.sb-label{font-size:11.5px;color:var(--sbText);margin-top:5px;
  letter-spacing:.5px;line-height:1.25;text-align:center;
  font-family:"Noto Sans TC",sans-serif;}

#sbToggle{display:none;position:fixed;top:14px;left:14px;z-index:120;
  width:42px;height:42px;border-radius:8px;border:0;
  background:var(--sbBg);color:var(--gold);font-size:20px;cursor:pointer;}

/* main */
.main{margin-left:var(--sbW);padding:0;min-height:100vh;}

/* Hero */
.site-hero{position:relative;overflow:hidden;
  background:linear-gradient(135deg,#1c1812 0%,#2a2218 40%,#3d3225 65%,#2a2218 100%);
  color:#fffdf7;padding:96px 24px 72px;text-align:center;}
.site-hero::before{content:"般若";position:absolute;font-size:380px;font-weight:900;
  color:rgba(255,255,255,.04);right:-20px;top:-30px;line-height:1;
  font-family:"Noto Serif TC",serif;pointer-events:none;}
.site-hero::after{content:"清淨";position:absolute;font-size:300px;font-weight:900;
  color:rgba(212,168,75,.04);left:-30px;bottom:-40px;line-height:1;
  font-family:"Noto Serif TC",serif;pointer-events:none;}
.hero-title{font-family:"Noto Serif TC",serif;font-size:56px;font-weight:900;
  color:var(--goldL);letter-spacing:6px;margin:0 0 12px;
  text-shadow:0 4px 18px rgba(0,0,0,.35);position:relative;z-index:2;}
.hero-vol{font-family:"Noto Sans TC",sans-serif;font-size:18px;letter-spacing:8px;
  color:#e8d9a8;margin:0 0 22px;position:relative;z-index:2;}
.hero-subtitle{font-family:"Noto Serif TC",serif;font-size:20px;color:#f0e6cc;
  font-weight:600;letter-spacing:2px;margin:0 0 14px;position:relative;z-index:2;}
.hero-sub{font-family:"Noto Sans TC",sans-serif;font-size:18px;color:#d9c8a0;
  letter-spacing:1px;line-height:1.7;max-width:760px;margin:0 auto 18px;
  position:relative;z-index:2;}
.hero-range{font-family:"Noto Sans TC",sans-serif;font-size:17px;
  color:rgba(212,168,75,.85);letter-spacing:3px;
  border-top:1px solid rgba(212,168,75,.25);
  border-bottom:1px solid rgba(212,168,75,.25);
  padding:10px 0;display:inline-block;margin-bottom:14px;
  position:relative;z-index:2;}
.hero-meta{font-family:"Noto Sans TC",sans-serif;font-size:14px;
  color:rgba(232,217,168,.65);letter-spacing:2px;position:relative;z-index:2;}

/* Preface */
.preface{max-width:980px;margin:36px auto 28px;padding:28px 36px;
  background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border:1px solid var(--border);border-left:5px solid var(--gold);border-radius:14px;
  box-shadow:0 3px 14px rgba(91,58,41,.07);}
.preface h2{font-family:"Noto Serif TC",serif;font-size:30px;font-weight:700;
  color:var(--accent);letter-spacing:6px;text-align:center;margin:0 0 22px;}
.preface p{font-size:19px;line-height:2.1;color:var(--text2);margin:0 0 14px;}
.preface p:last-child{margin-bottom:0;}

/* TOC */
.toc-section{max-width:1100px;margin:30px auto 36px;padding:28px 28px 12px;}
.toc-section .toc-title{font-family:"Noto Serif TC",serif;font-size:34px;
  font-weight:700;color:var(--accent);letter-spacing:10px;text-align:center;margin:0 0 8px;}
.toc-section .toc-desc{text-align:center;color:var(--text-muted);
  font-family:"Noto Sans TC",sans-serif;font-size:17px;letter-spacing:3px;margin-bottom:24px;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;}
.toc-card{background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:18px 22px;display:flex;gap:14px;align-items:center;
  text-decoration:none;color:inherit;
  transition:transform .25s,box-shadow .25s,border-color .25s;cursor:pointer;}
.toc-card:hover{transform:translateY(-2px);
  box-shadow:0 5px 18px rgba(91,58,41,.12);border-color:var(--gold);}
.toc-num{display:flex;align-items:center;justify-content:center;
  width:46px;height:46px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle,var(--gold) 0%,#946c08 100%);
  color:#fff;font-family:"Noto Sans TC",sans-serif;font-size:17px;font-weight:700;}
.toc-name{font-family:"Noto Serif TC",serif;font-size:19.5px;
  color:var(--text);line-height:1.7;font-weight:600;}

/* chapter */
.chapter{margin:54px 0 0;scroll-margin-top:20px;}
.ch-head{background:var(--headGrad);color:#fffdf7;
  padding:46px 24px 38px;text-align:center;position:relative;}
.ch-head::after{content:"";position:absolute;left:50%;bottom:18px;
  transform:translateX(-50%);width:120px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.ch-num{font-family:"Noto Sans TC",sans-serif;font-size:18px;
  letter-spacing:6px;color:var(--goldL);opacity:.9;margin-bottom:14px;}
.ch-name{font-family:"Noto Serif TC",serif;font-size:34px;font-weight:700;
  color:#fffdf7;letter-spacing:4px;margin:0 0 14px;
  text-shadow:0 2px 10px rgba(0,0,0,.4);}
.ch-sub{font-family:"Noto Sans TC",sans-serif;font-size:17px;
  color:rgba(232,217,168,.85);letter-spacing:2px;line-height:1.7;
  max-width:760px;margin:0 auto;}
.ch-body{max-width:1000px;margin:30px auto;padding:0 24px;background:transparent;}

/* bridge */
.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border:1px solid var(--border);border-left:5px solid var(--gold);
  border-radius:10px;padding:18px 24px;margin:0 0 26px;
  box-shadow:0 2px 10px rgba(91,58,41,.06);}
.bridge-outro{border-left-color:var(--accentL);
  background:linear-gradient(135deg,#fdf8e8,#f2e6c8);
  margin-top:30px;margin-bottom:14px;}
.bridge-label{display:inline-block;font-family:"Noto Sans TC",sans-serif;
  font-size:12.5px;background:var(--gold);color:#fff;
  padding:3px 12px;border-radius:12px;letter-spacing:2.2px;margin-bottom:10px;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0;color:var(--text2);line-height:2.1;font-size:18.5px;}

/* iframe */
.ch-frame{display:block;width:100%;border:0;background:#fffdf7;
  border:1px solid var(--border);border-radius:12px;
  box-shadow:0 4px 20px rgba(91,58,41,.1);
  margin:0 0 8px;min-height:180px;}

.next-link{display:inline-block;margin-top:14px;font-family:"Noto Sans TC",sans-serif;
  font-size:17px;color:var(--gold);letter-spacing:3px;
  border-bottom:1px solid rgba(184,134,11,.4);padding-bottom:3px;
  transition:color .25s,border-color .25s;}
.next-link:hover{color:var(--accent);border-bottom-color:var(--accent);}

/* footer */
.site-footer{max-width:980px;margin:60px auto 28px;padding:22px 24px;
  text-align:center;border-top:1px solid var(--border);
  color:var(--text-muted);font-family:"Noto Sans TC",sans-serif;
  font-size:15px;letter-spacing:3px;}

/* read-progress */
.read-progress{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:120;background:rgba(30,26,20,.92);color:var(--gold);
  padding:9px 24px;border-radius:30px;
  border:1px solid rgba(184,134,11,.5);
  box-shadow:0 4px 18px rgba(0,0,0,.25);
  font-family:"Noto Sans TC",sans-serif;
  font-size:14px;letter-spacing:2px;
  display:flex;align-items:center;gap:12px;
  pointer-events:none;user-select:none;
  backdrop-filter:blur(6px);
  transition:opacity .45s ease,transform .45s ease;
}
.read-progress.hide-near-end{opacity:0;transform:translateX(-50%) translateY(28px);}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);
  border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;
  background:linear-gradient(90deg,var(--gold),var(--goldL));
  width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px;}
.read-progress .rp-label{font-size:13px;opacity:.85;letter-spacing:4px;color:var(--goldL);}

#backTop{position:fixed;right:24px;bottom:72px;width:44px;height:44px;
  border-radius:50%;border:0;background:var(--sbBg);color:var(--gold);
  font-size:22px;cursor:pointer;display:none;z-index:110;
  box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .25s;}
#backTop:hover{transform:translateY(-3px);}

@media (max-width:900px){
  #sb{display:none;}
  #sbToggle{display:block;}
  .main{margin-left:0;}
  .hero-title{font-size:42px;letter-spacing:4px;}
  .hero-subtitle{font-size:17px;}
  .ch-name{font-size:26px;}
  .toc-grid{grid-template-columns:1fr;}
}
@media (max-width:600px){
  body{font-size:17px;}
  .hero-title{font-size:34px;}
  .preface{margin:18px;padding:18px;}
  .preface h2{font-size:24px;}
  .ch-head{padding:30px 18px 26px;}
}

  // 漢堡選單
  var sbT=document.getElementById('sbToggle'),sb=document.getElementById('sb');
  if(sbT&&sb){sbT.addEventListener('click',function(){
    sb.classList.toggle('open');
    sb.style.display=sb.classList.contains('open')?'flex':'';
  });}

  // back to top
  var bt=document.getElementById('backTop');
  if(bt){bt.addEventListener('click',function(){
    window.scrollTo({top:0,behavior:'smooth'});
  });}

  // iframe 自動高度
  function resizeFrame(f){
    try{
      var d=f.contentDocument||f.contentWindow.document;
      if(!d||!d.body) return;
      d.body.style.minHeight='0';d.body.style.height='auto';
      if(d.documentElement){
        d.documentElement.style.minHeight='0';
        d.documentElement.style.height='auto';
      }
      var h=d.body.scrollHeight;
      if(h>100){f.style.height=h+'px';f.style.minHeight='0';}
    }catch(e){}
  }
  function resizeAllFrames(){
    document.querySelectorAll('iframe.ch-frame').forEach(resizeFrame);
    updateProgress();
  }
  function setupFrame(f){
    var tries=0;
    function tick(){
      tries++;resizeFrame(f);
      if(tries<30) setTimeout(tick,200);
    }
    if(f.contentDocument&&f.contentDocument.readyState==='complete'){tick();}
    else{f.addEventListener('load',tick);}
  }
  document.querySelectorAll('iframe.ch-frame').forEach(setupFrame);
  var rzT;
  window.addEventListener('resize',function(){
    clearTimeout(rzT);rzT=setTimeout(resizeAllFrames,200);
  });

  // 錨點點擊防錯跳
  document.addEventListener('click',function(e){
    var a=e.target;
    while(a&&a.tagName!=='A') a=a.parentElement;
    if(!a) return;
    var h=a.getAttribute('href');
    if(!h||h.charAt(0)!=='#'||h.length<2) return;
    var id=h.substring(1);
    var el=document.getElementById(id);
    if(!el) return;
    e.preventDefault();
    resizeAllFrames();
    setTimeout(function(){
      resizeAllFrames();
      var rect=el.getBoundingClientRect();
      var y=window.scrollY+rect.top-20;
      window.scrollTo({top:y,behavior:'smooth'});
    },60);
  },true);

  // 進度條
  var rpFill=document.getElementById('rpFill');
  var rpPct=document.getElementById('rpPct');
  function updateProgress(){
    var sh=document.documentElement.scrollHeight-window.innerHeight;
    var pct=sh>0?Math.min(100,Math.max(0,window.scrollY/sh*100)):0;
    if(rpFill) rpFill.style.width=pct+'%';
    if(rpPct) rpPct.textContent=Math.round(pct)+'%';
  }
  window.addEventListener('scroll',function(){
    updateProgress();
    if(bt){bt.style.display=window.scrollY>600?'block':'none';}
    // sidebar active highlight
    var chapters=document.querySelectorAll('.chapter');
    var winH=window.innerHeight;
    var active=null;
    chapters.forEach(function(ch){
      var r=ch.getBoundingClientRect();
      if(r.top<winH*0.35) active=ch;
    });
    if(active){
      var id=active.id.replace('chapter-','');
      document.querySelectorAll('.sb-item').forEach(function(s){
        s.classList.toggle('active',s.dataset.ch===id);
      });
    }
  },{passive:true});
  updateProgress();

  // 接近頁尾時隱藏進度膠囊
  var cap=document.getElementById('readProgress');
  if(cap){
    function setHide(on){cap.classList.toggle('hide-near-end',!!on);}
    var targets=[];
    var f1=document.querySelector('.site-footer');
    if(f1) targets.push(f1);
    if('IntersectionObserver' in window && targets.length){
      var io=new IntersectionObserver(function(entries){
        var any=entries.some(function(e){return e.isIntersecting;});
        setHide(any);
      },{root:null,rootMargin:'0px 0px -20px 0px',threshold:0.01});
      targets.forEach(function(t){io.observe(t);});
    }else{
      window.addEventListener('scroll',function(){
        var dh=document.documentElement.scrollHeight;
        var sb=window.scrollY+window.innerHeight;
        setHide(dh-sb<240);
      },{passive:true});
    }
  }

  // 前 15 秒持續輪詢
  var _rt=0,_riv=setInterval(function(){
    _rt++;resizeAllFrames();
    if(_rt>50) clearInterval(_riv);
  },300);
})();
</script>

<script id="wy-print-intercept">
(function(){
  try{ window.print = function(){}; }catch(e){}
  document.addEventListener("keydown", function(e){
    if((e.metaKey||e.ctrlKey) && (e.key==="p"||e.key==="P"||e.keyCode===80)){
      e.preventDefault(); e.stopPropagation();
      return false;
    }
  }, true);
})();
</script>
<script id="wy-decoder">
(function(){
  if(!window.__wyReady) return;
  var KEY = "wy-dazhidulun-63-v1";
  function _dec(b64){
    try{
      var raw = atob(b64);
      var bytes = new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++){
        bytes[i] = (raw.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)) & 0xff;
      }
      if(typeof TextDecoder !== "undefined"){
        return new TextDecoder("utf-8").decode(bytes);
      }
      var s = "";
      for(var j=0;j<bytes.length;j++) s += String.fromCharCode(bytes[j]);
      return decodeURIComponent(escape(s));
    }catch(e){ return null; }
  }
  window.__wyReady.then(function(ok){
    if(!ok) return;
    document.querySelectorAll("iframe.ch-frame[data-c]").forEach(function(oldF){
      var decoded = _dec(oldF.getAttribute("data-c"));
      if(!decoded) return;
      var newF = document.createElement("iframe");
      for(var i=0;i<oldF.attributes.length;i++){
        var a = oldF.attributes[i];
        if(a.name === "data-c" || a.name === "srcdoc") continue;
        try{ newF.setAttribute(a.name, a.value); }catch(e){}
      }
      newF.setAttribute("srcdoc", decoded);
      try{ oldF.parentNode.replaceChild(newF, oldF); }catch(e){ return; }
      if(typeof window.setupFrame === "function"){
        try{ window.setupFrame(newF); }catch(e){}
      }
    });
    document.querySelectorAll("[data-wytext]").forEach(function(el){
      var t = _dec(el.getAttribute("data-wytext"));
      if(t === null) return;
      el.innerHTML = t;
      el.removeAttribute("data-wytext");
    });
    if(typeof window.resizeAllFrames === "function"){
      [150, 800, 2000].forEach(function(ms){
        setTimeout(function(){ try{ window.resizeAllFrames(); }catch(e){} }, ms);
      });
    }
  });
})();
</script>
